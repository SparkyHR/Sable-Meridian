<style>.career-panel{padding:16px;letter-spacing:0;color:#c9d7e3;font-size:12px;min-width:0}
.career-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid #344147;padding-bottom:12px}
.career-heading h2,.career-section-title{font-size:12px;font-weight:700;color:#6ee7ff;margin:0}
.career-badge{font-size:10px;color:#8aff8a}
.career-rank{font-size:22px;line-height:1.3;color:#ffb86a;font-weight:700;margin:20px 0 4px;overflow-wrap:anywhere}
.career-perks,.career-note{color:#9babb7;font-size:11px;margin:8px 0;line-height:1.6}
.career-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:16px 0;border-bottom:1px solid #344147}
.career-metric{min-width:0;display:flex;flex-direction:column;gap:4px}.career-metric span{font-size:10px;color:#9babb7}.career-metric strong{font-size:16px;color:#e2e8e9;overflow-wrap:anywhere}
.career-section-title{margin:20px 0 10px}.career-requirements{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px}.career-requirement>div{display:flex;justify-content:space-between;gap:12px;font-size:11px;flex-wrap:wrap}.career-requirement strong{color:#8aff8a}
.career-requirement progress{width:100%;height:6px;display:block;margin-top:8px;accent-color:#8aff8a}.career-requirement progress::-webkit-progress-bar{background:#29353b}.career-requirement progress::-webkit-progress-value{background:#8aff8a}
.career-modes{display:flex;gap:16px;flex-wrap:wrap}.career-modes label{display:flex;gap:6px;align-items:center;cursor:pointer}.career-modes input{accent-color:#6ee7ff}.career-modes:disabled{opacity:.65}
.career-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0}.career-actions button{border:1px solid #6ee7ff;background:#12262c;color:#6ee7ff;padding:8px 12px;border-radius:2px;font-size:11px;cursor:pointer;min-height:36px}.career-actions button:hover{background:#1a3740}.career-actions button:disabled{opacity:.4;cursor:default}.career-actions span{font-size:10px;color:#a7b5be}.career-actions button:focus-visible,.career-modes input:focus-visible{outline:2px solid #ffe066;outline-offset:3px}
.career-ladder{padding:0;list-style:none}.career-ladder li{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 0;border-top:1px solid #29353b;color:#87949d;font-size:11px}.career-ladder li.earned{color:#8aff8a}
.career-retirement{border-bottom:1px solid #344147;padding-top:18px}.career-retirement h3{font-size:15px;color:#8aff8a;margin-bottom:8px}.career-retirement p{font-size:12px;line-height:1.7}
.career-dialog-backdrop{position:fixed;inset:0;z-index:130;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:20px}.career-dialog{width:100%;max-width:480px;border:1px solid #6ee7ff;background:#10191e;padding:20px}.career-dialog h3{color:#ffb86a;font-size:16px;margin-bottom:12px}.career-dialog p{line-height:1.7}.career-dialog .career-actions{justify-content:flex-end}
@media(max-width:600px){.career-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.career-requirements{grid-template-columns:1fr}.career-ladder li{flex-direction:column;gap:4px}}
@media(max-width:767px){header>div:first-child>div:last-child{flex-wrap:wrap;max-width:100%;gap:6px}header>div:first-child>div:last-child>div{flex-shrink:0}header>div:nth-child(2)>div:last-child{flex-wrap:wrap;max-width:100%}}
</style><style>.intel-panel{padding:16px;font-size:12px;letter-spacing:0;min-width:0}.intel-events,.intel-factions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.intel-event,.intel-faction{border:1px solid #344147;border-radius:3px;padding:12px;min-width:0;background:#0a121a}.intel-event-heading{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}.intel-event-heading h4{font-size:13px;font-weight:700;color:#ffe066;margin:0}.intel-event-heading span,.intel-event-heading strong{font-size:10px;color:#8aff8a}.intel-event p,.intel-faction p{font-size:11px;line-height:1.6;margin-top:8px;overflow-wrap:anywhere}.intel-port{color:#9babb7;font-size:10px;margin-top:6px}.intel-effect{color:#6ee7ff}.intel-faction .intel-event-heading h4{color:var(--faction-color)}.intel-faction meter{display:block;width:100%;height:10px;margin-top:10px;accent-color:var(--faction-color)}.intel-history{list-style:none;padding:0}.intel-history li{padding:8px 0;border-top:1px solid #29353b;font-size:11px;line-height:1.6;overflow-wrap:anywhere}.intel-market-banner{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-bottom:1px solid #344147;font-size:11px;line-height:1.5;color:#9babb7}.intel-market-banner strong{color:#ffe066;font-weight:400}.intel-map-note{color:#9babb7;font-size:10px;margin-top:6px;line-height:1.5}@media(max-width:650px){.intel-events,.intel-factions{grid-template-columns:1fr}}
